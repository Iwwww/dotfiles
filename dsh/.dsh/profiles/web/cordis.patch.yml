# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# @lancecheney/dsh-deepseek-balance exports a plain-zod Config schema that
# rejects an absent config at boot ("expected object, received undefined").
# The bundle insert supplies none, so pin an empty object here.
- id: deepseek-balance
  config: {}

# Memory guide/tool copy language. Set from the language the user actually
# writes in (Russian), not from the English system prompt or file contents.
- id: meow-memory
  config:
    promptLang: 'ru'
